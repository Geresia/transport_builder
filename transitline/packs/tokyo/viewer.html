<!--
  tokyo CityPack 빠른 뷰어. 파이프라인 산출물이 아니라 "지금 팩에 뭐가 들어있나" 확인용
  1회성 도구 — korea-basemap.html 처럼 정식 유지보수 대상 아님.

  읽는 파일 (전부 같은 폴더): manifest.json, demand.json, wards-reference.json, obstacles.json,
  kanto-region.json, subward.json (있으면 — 현재 미나토구·주오구만)
  file:// 로는 fetch 가 막혀서 안 열림 — HTTP 로 띄울 것 (../docs/serve.ps1 -Root 이 폴더).

  베이스맵은 basemap.pmtiles (팩 자체 벡터: 물·지표·도로·철도, 줌 0-12). 파일이 없으면
  표준 OSM 래스터 타일 (계정/키 불필요) 에 다크 필터로 대체.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokyo CityPack — 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#0c1114;color:#e7eef0;
    font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:2;background:rgba(20,27,31,.94);
    border:1px solid #232f35;border-radius:10px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.7);font-size:12.5px;line-height:1.5}
  #legend{top:12px;left:12px;max-width:280px;padding:12px 14px}
  #legend h1{font-size:14px;margin:0 0 6px}
  #legend label{display:flex;align-items:center;gap:7px;margin:8px 0 6px;cursor:pointer}
  .ramp{display:flex;height:11px;border-radius:3px;overflow:hidden;margin:6px 0 3px}
  .ramp i{flex:1}
  .scale{display:flex;justify-content:space-between;font-size:9.5px;color:#6b7d85;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  .cap{color:#9caeb5;margin-top:8px;font-size:11px}
  .cap a{color:#9caeb5}
  .warn{color:#e08a4c}

  #card{top:12px;right:12px;width:260px;display:none;padding:14px}
  #card.on{display:block}
  #card h2{font-size:14px;margin:0 0 2px}
  #card .sub{font-size:11px;color:#6b7d85;margin-bottom:8px}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#232f35;border-radius:6px;overflow:hidden}
  .mini div{background:#141b1f;padding:8px 10px}
  .mini .k{font-size:10px;color:#6b7d85;font-family:"IBM Plex Mono",monospace}
  .mini .v{font-size:15px;font-weight:600}

  #detail{top:250px;right:12px;width:300px;max-height:calc(100vh - 270px);
    display:none;padding:14px;flex-direction:column;overflow:hidden}
  #detail.on{display:flex}
  #detail #ddata{display:flex;flex-direction:column;min-height:0;flex:1}
  #detail .dhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  #detail .dhead h3{font-size:13px;margin:0}
  #detail .dclose{cursor:pointer;color:#6b7d85;font-size:14px;line-height:1;padding:2px 4px}
  #detail .dclose:hover{color:#e7eef0}
  #detail .dtoggle{flex:0 0 auto;display:flex;gap:0;margin:2px 0 8px;border:1px solid #232f35;border-radius:6px;overflow:hidden}
  #detail .dtoggle button{flex:1;background:#141b1f;color:#9caeb5;border:0;padding:6px 4px;font-size:11.5px;cursor:pointer;font-family:inherit}
  #detail .dtoggle button.on{background:#2A6771;color:#fff;font-weight:600}
  #detail .dtoggle button#mjob.on{background:#b5651d}
  #detail .dnote{flex:0 0 auto;font-size:11px;color:#6b7d85;margin-bottom:6px}
  #detail .dmissing{color:#e08a4c;font-size:12px;line-height:1.6}
  #detail .dramp{flex:0 0 auto;display:flex;height:8px;border-radius:3px;overflow:hidden;margin:4px 0 2px}
  #detail .dramp i{flex:1}
  #detail .dscale{flex:0 0 auto;display:flex;justify-content:space-between;font-size:9px;color:#6b7d85;
    font-family:"IBM Plex Mono",ui-monospace,monospace;margin-bottom:8px}
  #detail .dlist{flex:1 1 auto;min-height:0;overflow-y:auto;border-top:1px solid #232f35}

  .maplibregl-popup-content{color:#000}

  @media(max-width:760px){#legend{max-width:200px}#card{width:200px}#detail{width:220px}}
</style>

<div id="map"></div>

<div class="panel" id="legend">
  <h1>tokyo CityPack</h1>
  <div id="meta">불러오는 중…</div>
  <div class="ovl-title">밀도 표시 — 둘 다 끄면 일반 지도</div>

  <label><input type="checkbox" id="toggle-munilabels" checked> 구·시·정·촌 이름 표시</label>
  <label><input type="checkbox" id="toggle-3d"> 3D 보기 (건물·고가도로 입체, 줌 14+ 권장)</label>
  <label style="margin-left:18px"><input type="checkbox" id="toggle-3d-terrain"> 3D 지형 고도 (산지용 — 켜면 도심 고가도로가 계단처럼 보임)</label>

  <label><input type="checkbox" id="toggle-labels"> 큰 건물 이름 (OSM, 줌 15+)</label>
  <div class="cap" id="commute-cap" style="display:none"></div>

  <div class="dhead"><h3 id="dtitle">정목(町丁)별 인구</h3><span class="dclose" id="dclose" title="닫기">✕</span></div>

    <div class="dtoggle"><button id="mres" class="on">거주 인구</button><button id="mjob">종사자(일자리)</button></div>
    <div class="dnote" id="dnote"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script>
// 지도 배경 테마: "light"(네이버 지도풍 — 베이지 땅, 파스텔 초록 숲·공원, 연한 하늘색 물, 흰 도로, 회색 건물) / "dark".
// 범례의 "밝은 지도" 체크박스로 바꾸며 localStorage 에 저장(바꾸면 새로고침).
let THEME_NAME = "light";
try { THEME_NAME = localStorage.getItem("tokyo-theme") || "light"; } catch { /* private mode */ }
const THEME = THEME_NAME === "dark" ? {
  name: "dark", bg: "#0e1a24", earth: "#1b2229", water: "#0e1a24", river: "#16283a",
  landuse: { forest: "#1d4a30", farm: "#4a4a26", grass: "#33502f", park: "#2a5238", wetland: "#1f4a4a", sand: "#5a5238", school: "#26332d", hospital: "#26332d", industrial: "#26332d", other: "#26332d" }, landuseOp: 0.9,
  hs: { exag: 0.7, shadow: "#04080a", highlight: "#7f9299", accent: "#0d1519" },
  road: { minor: "#2a333c", medium: "#39434d", major: "#4b5661", highway: "#6b7785", rail: "#d9a441", case: "#1b2229" },
  bldg: "#e7eef0", bldgLine: "#e7eef0", bldgOp: 0.5, zero: "#6b7378",
  bldgRes: "#e7eef0", bldgHouse: "#e7eef0", bldgPub: "#e7eef0", bldgInd: "#e7eef0", bldgCom: "#e7eef0",
  area: { park: "#2a5238", edu: "#25384d", hospital: "#4a2f33", commercial: "#2a2a30", industrial: "#25262d", farm: "#4a4a26", forest: "#1d4a30", grass: "#33502f", railway: "#252b31", military: "#33342a", residential: null },
  label: { park: "#8fd19a", edu: "#8fb4ea", hospital: "#e79a9a", halo: "rgba(12,17,20,0.9)", text: "#f4f8f9" },
  ramp: ["#16272B","#1B3B42","#215059","#2A6771","#357F8A","#4A9BA5","#71B9C1","#A6D8DC"],
  jramp: ["#2a1c10", "#43290f", "#5e3510", "#7c4412", "#9c5416", "#c06a1c", "#e58f34", "#f7c168"],
} : {
  // 네이버 지도 규칙: 땅 흰색~아주 연한 회색, 물 연한 파랑, 숲·공원 연한 초록, 학교·관공서 회녹/베이지,
  // 도로 = 고속도로 주황 / 간선 노랑 / 골목 흰색, 철도 보라, 주거 건물 연노랑, 상업·일반 건물 흰색.
  name: "light", bg: "#c9e0f5", earth: "#f6f5f1", water: "#c3dcf3", river: "#a9cdee",
  landuse: { forest: "#d3e9c4", farm: "#eef0d6", grass: "#deeeca", park: "#d5eac6", wetland: "#d1e7e0", sand: "#f2ead0", school: "#e8ecdc", hospital: "#f5e6e6", industrial: "#ebe9ef", other: "#efeee9" }, landuseOp: 1,
  hs: { exag: 0.25, shadow: "#8a8474", highlight: "#ffffff", accent: "#c4bfb0" },
  road: { minor: "#ffffff", medium: "#fff6cf", major: "#fbd75e", highway: "#f5a04a", rail: "#9b5fc0", case: "#dedad0" },
  bldg: "#ffffff", bldgLine: "#cdc8bd", bldgOp: 0.98, zero: "#e4e0d8",
  bldgRes: "#fbecc0", bldgHouse: "#f1eee6", bldgPub: "#e2e8d3", bldgInd: "#e8e5ee", bldgCom: "#ffffff",
  // 공원 = 선명한 연초록, 학교 부지 = 연한 청회색(네이버 지도 샘플), 병원 = 연분홍, 상업 = 연분홍 회색, 공업 = 연보라 회색
  area: { park: "#c6e2b1", edu: "#d9e4f2", hospital: "#f6e0e0", commercial: "#f8ecec", industrial: "#ebeaf2", farm: "#eef0d6", forest: "#d0e8c0", grass: "#dcedc8", railway: "#ececea", military: "#e8e4d8", residential: null },
  label: { park: "#3f8a3f", edu: "#3f6db0", hospital: "#c0504d", halo: "#ffffff", text: "#3b3f44" },
  // 인구 밀도 = 흰색 → 노랑 → 주황 → 빨강, 종사자(회사원) 밀도 = 흰색 → 하늘 → 남색
  ramp: ["#fffaf0", "#fff0c9", "#ffdf9c", "#ffc46b", "#fba03f", "#ee7a2c", "#d6491f", "#a3221b"],
  jramp: ["#f7faff", "#e3edfb", "#c6d8f5", "#a2bdeb", "#7b9adb", "#5876c4", "#3b54a6", "#25367c"],
};
const RAMP = THEME.ramp;
const JRAMP = THEME.jramp;
const nf = (n) => Math.round(Number(n)).toLocaleString("ja-JP");
// Data-derived strings (area/building/region names from tile properties or JSON) go through popups'
// innerHTML/setHTML as plain interpolated text — escape before every such use so a name containing
// HTML-special characters can't inject markup (code-review-2026-09-22.md S-02).
const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC_MAP[c]);
// step 표현식은 경계값이 엄격하게 증가해야 함 — 0이 많은 데이터(지붕 등)는 분위수가 겹쳐서 중복 제거
const stepExpr = (prop, cuts, ramp) => {
  const e = ["step", ["get", prop], ramp[0]];
  let last = -Infinity;
  cuts.forEach((c, i) => { if (c > last) { e.push(c, ramp[i + 1]); last = c; } });
  return e;
};

// 도쿄 23구 한글 표기 (jisCode 로 조인) — 베이스맵 타일 자체 라벨(도로명·지명)은
// OSM raster 에 박혀 있어 여기서 못 바꾼다. 우리가 그리는 패널/범례만 한글화.
const KO_NAMES = {
  131211: "아다치구", 131181: "아라카와구", 131059: "분쿄구", 131016: "지요다구",
  131024: "주오구", 131237: "에도가와구", 131199: "이타바시구", 131229: "가쓰시카구",
  131172: "기타구", 131083: "고토구", 131105: "메구로구", 131032: "미나토구",
  131148: "나카노구", 131202: "네리마구", 131113: "오타구", 131121: "세타가야구",
  131130: "시부야구", 131091: "시나가와구", 131041: "신주쿠구", 131156: "스기나미구",
  131075: "스미다구", 131067: "다이토구", 131164: "도시마구",
};

// 사이타마·지바·가나가와 + 도쿄 다마 지역 (kanto-region.json, tier 1 = 서울 수도권과
// 대응되는 핵심 생활권). 이 mapping 은 원본 Transportation Tycoon 아티팩트에서 그대로
// 가져옴 — 주요 도시만 커버, 나머지는 일본어 원문으로 표시됨.
const PREF_KO = { "東京都": "도쿄도", "神奈川県": "가나가와현", "埼玉県": "사이타마현", "千葉県": "지바현" };
const CITY_KO = {
  "横浜市": "요코하마시", "川崎市": "가와사키시", "相模原市": "사가미하라시", "横須賀市": "요코스카시",
  "藤沢市": "후지사와시", "鎌倉市": "가마쿠라시", "小田原市": "오다와라시", "厚木市": "아쓰기시",
  "茅ヶ崎市": "지가사키시", "平塚市": "히라쓰카시", "大和市": "야마토시", "逗子市": "즈시시", "三浦市": "미우라시",
  "さいたま市": "사이타마시", "川口市": "가와구치시", "川越市": "가와고에시", "所沢市": "도코로자와시",
  "越谷市": "고시가야시", "草加市": "소카시", "春日部市": "가스카베시", "熊谷市": "구마가야시",
  "上尾市": "아게오시", "新座市": "니이자시", "狭山市": "사야마시", "入間市": "이루마시",
  "朝霞市": "아사카시", "和光市": "와코시", "戸田市": "도다시",
  "千葉市": "지바시", "船橋市": "후나바시시", "松戸市": "마쓰도시", "市川市": "이치카와시",
  "浦安市": "우라야스시", "柏市": "가시와시", "成田市": "나리타시", "木更津市": "기사라즈시",
  "習志野市": "나라시노시", "流山市": "나가레야마시", "我孫子市": "아비코시", "佐倉市": "사쿠라시", "八千代市": "야치요시",
};

// 가타카나 -> 한글 표기법 변환 (국립국어원 일본어 표기법 근사) — 정목(町丁) 이름의
// reading_kana(subward.json, 일본 우편번호부 공식 후리가나 + 정형화된 정목 카운터 표기)를
// 일본어를 못 읽는 사용자를 위해 한글로 보여주기 위한 것. か/た행은 어두/어중에 따라
// 예사소리/거센소리가 갈리고, 촉음(っ)과 ん은 직전 음절의 받침으로 합쳐진다 (예: ロッポンギ
// -> 롯폰기). 흔치 않은 요음 조합까지 완전히 검증된 표는 아니라 근사치임.
const KANA_TABLE = {
  ア:"아", イ:"이", ウ:"우", エ:"에", オ:"오",
  カ:["가","카"], キ:["기","키"], ク:["구","쿠"], ケ:["게","케"], コ:["고","코"],
  サ:"사", シ:"시", ス:"스", セ:"세", ソ:"소",
  タ:["다","타"], チ:["지","치"], ツ:"쓰", テ:["데","테"], ト:["도","토"],
  ナ:"나", ニ:"니", ヌ:"누", ネ:"네", ノ:"노",
  ハ:"하", ヒ:"히", フ:"후", ヘ:"헤", ホ:"호",
  マ:"마", ミ:"미", ム:"무", メ:"메", モ:"모",
  ヤ:"야", ユ:"유", ヨ:"요",
  ラ:"라", リ:"리", ル:"루", レ:"레", ロ:"로",
  ワ:"와", ヲ:"오",
  ガ:"가", ギ:"기", グ:"구", ゲ:"게", ゴ:"고",
  ザ:"자", ジ:"지", ズ:"즈", ゼ:"제", ゾ:"조",
  ダ:"다", ヂ:"지", ヅ:"즈", デ:"데", ド:"도",
  バ:"바", ビ:"비", ブ:"부", ベ:"베", ボ:"보",
  パ:"파", ピ:"피", プ:"푸", ペ:"페", ポ:"포",
  キャ:["갸","캬"], キュ:["규","큐"], キョ:["교","쿄"],
  シャ:"샤", シュ:"슈", ショ:"쇼",
  チャ:["자","차"], チュ:["주","추"], チョ:["조","초"],
  ニャ:"냐", ニュ:"뉴", ニョ:"뇨",
  ヒャ:"햐", ヒュ:"휴", ヒョ:"효",
  ミャ:"먀", ミュ:"뮤", ミョ:"묘",
  リャ:"랴", リュ:"류", リョ:"료",
  ギャ:"갸", ギュ:"규", ギョ:"교",
  ジャ:"자", ジュ:"주", ジョ:"조",
  ビャ:"뱌", ビュ:"뷰", ビョ:"뵤",
  ピャ:"퍄", ピュ:"퓨", ピョ:"표",
};
const YOON_HEADS = new Set(["キ","シ","チ","ニ","ヒ","ミ","リ","ギ","ジ","ビ","ピ"]);
const YOON_TAILS = new Set(["ャ","ュ","ョ"]);

function addBatchim(blocks, jong) {
  if (blocks.length === 0) return;
  const ch = blocks[blocks.length - 1];
  const code = ch.codePointAt(0) - 0xac00;
  if (code < 0 || code > 11171) return; // 합성 음절이 아니면(드묾) 무시
  const cho = Math.floor(code / (21 * 28));
  const jung = Math.floor((code % (21 * 28)) / 28);
  blocks[blocks.length - 1] = String.fromCodePoint(0xac00 + (cho * 21 + jung) * 28 + jong);
}

function kanaToKo(kana) {
  if (!kana) return null;
  const blocks = [];
  let i = 0;
  while (i < kana.length) {
    const c = kana[i];
    if (c === "ー") { i++; continue; } // 장음 부호는 표기하지 않음
    if (c === "ッ") { addBatchim(blocks, 19 /* ㅅ */); i++; continue; }
    if (c === "ン") { addBatchim(blocks, 4 /* ㄴ */); i++; continue; }
    let mora = c;
    if (YOON_HEADS.has(c) && i + 1 < kana.length && YOON_TAILS.has(kana[i + 1])) {
      mora = c + kana[i + 1];
      i += 2;
    } else {
      i += 1;
    }
    const entry = KANA_TABLE[mora];
    if (entry == null) continue; // 표에 없는 문자는 건너뜀 (완전한 표는 아님)
    const isInitial = blocks.length === 0;
    blocks.push(Array.isArray(entry) ? (isInitial ? entry[0] : entry[1]) : entry);
  }
  return blocks.join("");
}

// 시정촌 이름용 한글 변환: 장음(オウ·オオ·ユウ·ョウ)은 표기하지 않고, 정령시의 구(区)는 "구"로 (도쿄 23구 KO_NAMES 와 통일)
function muniKo(kana, isWard) {
  if (!kana) return null;
  let k = kana.replace(/([オコソトノホモヨロゴゾドボポョュ])[ウオ]/g, "$1");
  if (isWard && k.endsWith("ク")) return kanaToKo(k.slice(0, -1)) + "구";
  return kanaToKo(k);
}

// manifest.compressed lists big JSON files that also exist as gzip siblings (x.json.gz); those are
// fetched compressed and inflated here, falling back to the plain file. Filled once manifest.json is read.
const gzFiles = new Set();
async function loadJSON(url) {
  try {
    if (gzFiles.has(url.replace(/^\.\//, ""))) {
      try {
        const g = await fetch(url + ".gz");
        if (g.ok) return await new Response(g.body.pipeThrough(new DecompressionStream("gzip"))).json();
      } catch { /* fall through to the plain file */ }
    }
    const r = await fetch(url);
    return r.ok ? r.json() : null;
  } catch { return null; }
}

// ---- 자체 basemap (basemap.pmtiles, Protomaps/OSM: 물·지표·도로·철도) ----
// 파일이 있으면 외부 OSM 래스터 타일을 숨기고 이걸 배경으로 쓴다. 없으면 래스터 그대로.
// pmtiles 프로토콜은 여기서 한 번만 등록한다 (건물 레이어도 같은 프로토콜을 씀).
let pmtilesProtocolReady = false;
function ensurePmtilesProtocol() {
  if (pmtilesProtocolReady || typeof pmtiles === "undefined") return pmtilesProtocolReady;
  maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
  return (pmtilesProtocolReady = true);
}

async function addBasemap() {
  if (!ensurePmtilesProtocol()) return;
  const url = new URL("./basemap.pmtiles", location.href).href;
  // 존재 확인: HEAD 는 docs/serve.ps1 이 처리 못 해서(500) 1바이트 Range GET 으로 대신하고 본문은 버린다.
  try {
    const probe = await fetch(url, { headers: { Range: "bytes=0-0" } });
    probe.body?.cancel();
    if (!probe.ok) return;
  } catch { return; }

  map.addSource("basemap", { type: "vector", url: "pmtiles://" + url,
    attribution: '&copy; OpenStreetMap contributors, ODbL · Protomaps' });
  // 음영기복(산·계곡): AWS Terrain Tiles (Terrarium 인코딩, 오픈 데이터) — 온라인일 때만 표시, 실패해도 나머지는 그대로
  map.addSource("terrain", { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 13,
    tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
    attribution: "Terrain: Mapzen/AWS Terrain Tiles (SRTM·GSI 등)" });
  const road = (kind) => ["all", ["==", ["get", "kind"], kind], ["!=", ["get", "is_tunnel"], true]];
  const layers = [
    { id: "bm-bg", type: "background", paint: { "background-color": THEME.bg } },
    { id: "bm-earth", source: "basemap", "source-layer": "earth", type: "fill", paint: { "fill-color": THEME.earth } },
    // 지형: 토지 피복(숲·논밭·초지·공원·습지·모래)을 색으로 구분 — 건물이 없는 곳이 산·들판·농지·물가임을 알아보게 함
    { id: "bm-landuse", source: "basemap", "source-layer": "landuse", type: "fill",
      filter: ["in", ["get", "kind"], ["literal", ["forest", "wood", "nature_reserve", "farmland", "allotments", "grass", "grassland", "scrub", "meadow", "park", "garden", "recreation_ground", "golf_course", "wetland", "sand", "cemetery", "school", "college", "university", "hospital", "industrial", "military"]]],
      paint: { "fill-color": ["match", ["get", "kind"],
        ["forest", "wood", "nature_reserve"], THEME.landuse.forest,
        ["farmland", "allotments"], THEME.landuse.farm,
        ["grass", "grassland", "scrub", "meadow"], THEME.landuse.grass,
        ["park", "garden", "recreation_ground", "golf_course"], THEME.landuse.park,
        "wetland", THEME.landuse.wetland,
        "sand", THEME.landuse.sand,
        ["school", "college", "university", "military"], THEME.landuse.school,
        "hospital", THEME.landuse.hospital,
        "industrial", THEME.landuse.industrial,
        THEME.landuse.other], "fill-opacity": THEME.landuseOp } },
    { id: "bm-hillshade", source: "terrain", type: "hillshade",
      paint: { "hillshade-exaggeration": THEME.hs.exag, "hillshade-shadow-color": THEME.hs.shadow, "hillshade-highlight-color": THEME.hs.highlight,
        "hillshade-accent-color": THEME.hs.accent, "hillshade-illumination-direction": 315 } },
    { id: "bm-water", source: "basemap", "source-layer": "water", type: "fill", paint: { "fill-color": THEME.water } },
    { id: "bm-river", source: "basemap", "source-layer": "water", type: "line",
      filter: ["==", ["geometry-type"], "LineString"], paint: { "line-color": THEME.river, "line-width": 1.2 } },
    // 흰 골목이 흰 땅 위에서 보이도록 옅은 회색 테두리(케이싱)를 한 겹 깐다
    { id: "bm-road-case-minor", source: "basemap", "source-layer": "roads", type: "line", minzoom: 12,
      filter: road("minor_road"), paint: { "line-color": THEME.road.case, "line-width": 1.7 } },
    { id: "bm-road-case-medium", source: "basemap", "source-layer": "roads", type: "line", minzoom: 10,
      filter: road("medium_road"), paint: { "line-color": THEME.road.case, "line-width": 2.1 } },
    { id: "bm-road-minor", source: "basemap", "source-layer": "roads", type: "line", minzoom: 11,
      filter: road("minor_road"), paint: { "line-color": THEME.road.minor, "line-width": 0.9 } },
    { id: "bm-road-medium", source: "basemap", "source-layer": "roads", type: "line", minzoom: 9,
      filter: road("medium_road"), paint: { "line-color": THEME.road.medium, "line-width": 1.1 } },
    { id: "bm-road-major", source: "basemap", "source-layer": "roads", type: "line",
      filter: road("major_road"), paint: { "line-color": THEME.road.major, "line-width": 1.6 } },
    { id: "bm-road-highway", source: "basemap", "source-layer": "roads", type: "line",
      filter: road("highway"), paint: { "line-color": THEME.road.highway, "line-width": 2.2 } },
    { id: "bm-rail", source: "basemap", "source-layer": "roads", type: "line", minzoom: 9,
      filter: ["all", ["==", ["get", "kind"], "rail"], ["!=", ["get", "kind_detail"], "light_rail"]],
      layout: { visibility: "none" }, // 기본 숨김 — "철도" 체크박스로 켬
      paint: { "line-color": THEME.road.rail, "line-width": 1.4, "line-opacity": 0.85 } },
  ];
  for (const l of layers) map.addLayer(l);
  if (map.getLayer("osm")) map.setLayoutProperty("osm", "visibility", "none");
}

map.on("load", async () => {
  await addBasemap().catch((err) => console.warn("basemap.pmtiles 연결 실패, OSM 래스터로 대체:", err));
  const manifest = await loadJSON("./manifest.json");
  for (const f of Object.keys(manifest?.compressed ?? {})) gzFiles.add(f);
  const [demand, wards, obstacles, region, subward, buildingPop, jobs, jobsGrid, muniKana, specialDemand, od, odSchool] = await Promise.all([
    loadJSON("./demand.json"),
    loadJSON("./wards-reference.json"), loadJSON("./obstacles.json"),
    loadJSON("./kanto-region.json"), loadJSON("./subward.json"),
    loadJSON("./building-population.json"), loadJSON("./jobs.json"), loadJSON("./jobs-buildings.json"),
    loadJSON("./municipality-kana.json"), loadJSON("./special-demand.json"),
    loadJSON("./od.json"), loadJSON("./od-school.json"),
  ]);

  const PREF_FILES = { "11": "saitama", "12": "chiba", "14": "kanagawa" };
  // 건물별 직장을 PLATEAU 실측 속성(용도·연면적, 도쿄 토지이용조사와 같은 방식)으로 배분한 도시들
  // (jobs-buildings-<slug>.json). OSM 태그만으로 만든 사이타마·지바·가나가와 현 전체 pref-building-jobs.mjs
  // 모델보다 정밀해서, 겹치는 픽셀에서는 이쪽 팝업이 우선한다(regClick 가드 참고).
  // plateau-jobs-index.json 의 도시 목록(불러온 뒤 채움). loaded = 이 도시의 파일과 레이어를 이미 만들었는가.
  let plateauJobsCities = [];
  const plateauJobLayerIds = () => plateauJobsCities.filter((c) => c.loaded).map((c) => `plateau-jobs-${c.slug}-circle`);
  const prefMunis = new Map();
  const regionFeatureByCode = new Map();
  let loadPref = null;

  if (manifest) {
    document.getElementById("meta").textContent =
      `${manifest.name} · v${manifest.version} · ${manifest.data.license}`;
  }

  // ---- 광역권 인구밀도 (kanto-region.json 폴리곤 + demand.json 의 kanto-* 포인트, code 로 조인) ----
  // 사이타마·지바·가나가와 + 도쿄 다마. 서울로 치면 경기·인천에 해당하는, 원본 아티팩트가
  // tier 1("핵심 생활권")로 구분한 범위. 지정도시(요코하마·가와사키·사이타마·지바·사가미하라)는
  // 구 단위로 쪼개져 있음 — popDate 가 "2026-08"(추계인구)였던 이 44개 구 + 도쿄 다마
  // 30개시는 2026-09-21 이후 2020 국세조사 원값으로 교체됨(추계는 residentsEst2026). 전 지점 popDate "2020".
  // README.md 참고.
  if (region && demand) {
    const byRegionCode = new Map(
      demand.points.filter((p) => p.code).map((p) => [p.code, p])
    );
    const features = region.municipalities.map((m) => {
      // 주요 도시는 CITY_KO, 나머지는 우편번호부 후리가나(municipality-kana.json)를 kanaToKo()로 변환
      const mk = (muniKana || {})[String(m.code)] || {};
      const parent_ko = m.parent ? (CITY_KO[m.parent] || muniKo(mk.p) || m.parent) : null;
      const name_ko = CITY_KO[m.name] || (parent_ko ? `${parent_ko} ${muniKo(mk.n, !!CITY_KO[m.parent]) || m.name}` : (muniKo(mk.n) || m.name));
      const p = byRegionCode.get(String(m.code));
      const density = p ? p.residents / m.area_km2 : null;
      return { type: "Feature",
        properties: { code: String(m.code), name: m.name, name_ko, pref_ko: PREF_KO[m.pref] || m.pref, area: m.area_km2,
          residents: p ? p.residents : null, density, popDate: p ? p.popDate : null },
        geometry: { type: "MultiPolygon", coordinates: m.polygons } };
    });
    features.forEach((f) => regionFeatureByCode.set(f.properties.code, f));
    map.addSource("region", { type: "geojson", data: { type: "FeatureCollection", features } });

    const rds = features.map((f) => f.properties.density).filter((d) => d != null).sort((a, b) => a - b);
    const rcuts = Array.from({ length: 7 }, (_, i) => rds[Math.floor(((i + 1) / 8) * (rds.length - 1))]);
    const rStepColor = ["step", ["get", "density"], RAMP[0]];
    rcuts.forEach((c, i) => rStepColor.push(c, RAMP[i + 1]));

    map.addLayer({ id: "region-fill", source: "region", type: "fill",
      paint: { "fill-color": rStepColor, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0.45, 12, 0.18] } });
    map.addLayer({ id: "region-line", source: "region", type: "line",
      paint: { "line-color": "#0c1114", "line-width": 0.5, "line-opacity": 0.4 } });
    // 시·정·촌 이름 (사이타마·지바·가나가와·도쿄 다마) — 큰 지자체가 먼저 배치되도록 면적순, 겹치면 자동으로 숨겨짐
    map.addLayer({ id: "region-label", source: "region", type: "symbol", minzoom: 7, maxzoom: 12,
      layout: { "text-field": ["get", "name_ko"], "text-font": ["Noto Sans Regular"],
        "text-size": ["interpolate", ["linear"], ["zoom"], 7, 9, 12, 12.5], "text-max-width": 6,
        "symbol-sort-key": ["*", -1, ["get", "area"]] },
      paint: { "text-color": THEME.name === "dark" ? "#c7cdd2" : "#5a5f66", "text-halo-color": THEME.label.halo, "text-halo-width": 1.3 } });
    document.getElementById("toggle-munilabels").addEventListener("change", (e) => {
      const v = e.target.checked ? "visible" : "none";
      for (const id of ["region-label", "wards-label"]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v);
    });
    map.on("click", "region-fill", async (e) => {
      if (hitsDetailLayer(e) || hitsWardsFill(e)) return;
      const p = e.features[0].properties;
      const code = String(p.code);
      const pref = PREF_FILES[code.slice(0, 2)];
      const hasPref = !!(pref && loadPref);
      if (!hasPref) showRegionDetail(code, regionFeatureByCode.get(code));
      else map.setFilter("wards-sel", ["==", ["get", "name"], ""]);
      document.getElementById("card").classList.add("on");
      document.getElementById("cname").textContent = p.name_ko;
      document.getElementById("csub").textContent = `${p.pref_ko} · ${p.name_ko} · ${p.area}km²`
        + (p.popDate ? ` · ${p.popDate === "2020" ? "2020 census" : p.popDate === "2020-derived" ? "2020 census (역산)" : "추계인구 " + p.popDate}` : "");
      document.getElementById("cres").textContent = p.residents ? nf(p.residents) : "미확보";
      document.getElementById("cden").textContent = p.density ? nf(p.density) + "/km²" : "미확보";
      document.getElementById("cjobs").textContent = "—";
      document.getElementById("cratio").textContent = "—";
      if (hasPref) {
        // 사이타마·지바·가나가와: 클릭한 시점에 해당 현 파일만 불러옴
        document.getElementById("detail").classList.add("on");
        document.getElementById("ddata").style.display = "none";
        const m = document.getElementById("dmissing");
        m.style.display = "block"; m.textContent = "정목 데이터 불러오는 중…";
        const ok = await loadPref(pref);
        const sw = prefMunis.get(code);
        const jw = jobs && jobs.wards[code];
        document.getElementById("cjobs").textContent = jw ? nf(jw.workers_total) : "—";
        document.getElementById("cratio").textContent = jw && p.residents ? (jw.workers_total / p.residents).toFixed(1) + "배" : "—";
        if (ok && sw) showWardDetail(code, p.name_ko, regionFeatureByCode.get(code), sw);
        else { m.textContent = `${p.name_ko}의 정목 데이터를 불러오지 못했습니다.`; }
      }
    });
    map.on("mouseenter", "region-fill", () => (map.getCanvas().style.cursor = "pointer"));

    document.getElementById("legend").insertAdjacentHTML("beforeend",
      '<div class="cap warn">wards-reference.json 또는 demand.json 을 불러오지 못했습니다.</div>');
  }

  // ---- 정목(町丁)별 상세 인구 (subward.json — 현재 미나토구·주오구 파일럿만) ----
  if (subward && subward.wards) {
    const features = [];
    for (const [jis, w] of Object.entries(subward.wards)) {
      for (const a of w.areas) {
        const km2 = a.area_m2 / 1e6;
        features.push({
          type: "Feature",
          properties: {
            wardJis: jis, code: a.code, name_ja: a.name_ja,
            residents: a.residents, households: a.households,
            area_km2: km2, density: km2 > 0 ? a.residents / km2 : 0,
            wdensity: km2 > 0 && jobs && jobs.areas[a.code] ? jobs.areas[a.code].w / km2 : 0,
          },
          geometry: { type: "MultiPolygon", coordinates: a.polygons },
        });
      }
    }
    map.addSource("subward", { type: "geojson", data: { type: "FeatureCollection", features } });

    let sds = features.map((f) => f.properties.density).sort((a, b) => a - b);
    let scuts = Array.from({ length: 7 }, (_, i) => sds[Math.floor(((i + 1) / 8) * (sds.length - 1))]);
    let sStepColor = ["step", ["get", "density"], RAMP[0]];
    scuts.forEach((c, i) => sStepColor.push(c, RAMP[i + 1]));

    map.addLayer({ id: "subward-fill", source: "subward", type: "fill",
      filter: ["==", ["get", "wardJis"], "__none__"],
      paint: { "fill-color": sStepColor, "fill-opacity": 0.75 } });
    map.addLayer({ id: "subward-line", source: "subward", type: "line",
      filter: ["==", ["get", "wardJis"], "__none__"],
      paint: { "line-color": "#0c1114", "line-width": 0.6, "line-opacity": 0.7 } });
    map.addLayer({ id: "subward-sel", source: "subward", type: "line",
      filter: ["==", ["get", "code"], "__none__"],
      paint: { "line-color": "#e08a4c", "line-width": 2.5 } });

    // 종사자(일자리) 밀도 지도: 주황 계열 색상표로 거주 인구(청록)와 구분
    let jds = features.map((f) => f.properties.wdensity).sort((a, b) => a - b);
    let jcuts = Array.from({ length: 7 }, (_, i) => jds[Math.floor(((i + 1) / 8) * (jds.length - 1))]);
    let jStepColor = stepExpr("wdensity", jcuts, JRAMP);

    // 종사자 건물별 (jobs-buildings.json — 현재 마루노우치1초메만, 모델 추정치)
    if (jobsGrid && jobsGrid.areas) {
      const codeToJis = new Map();
      for (const [jis, w] of Object.entries(subward.wards)) for (const a of w.areas) codeToJis.set(a.code, jis);
      const gf = [];
      for (const [code, ar] of Object.entries(jobsGrid.areas)) {
        for (const b of ar.buildings) {
          gf.push({ type: "Feature",
            properties: { wardJis: codeToJis.get(code) || "", name: ar.name_ja, w: b.workers, levels: b.levels,
              levels_known: b.levels_known, area_m2: b.area_m2, kind: b.sourceKind },
            geometry: { type: "Polygon", coordinates: [b.polygon] } });
        }
      }
      map.addSource("jobsgrid", { type: "geojson", data: { type: "FeatureCollection", features: gf } });
      const gv = gf.map((f) => f.properties.w).sort((a, b) => a - b);
      const gcuts = Array.from({ length: 7 }, (_, i) => gv[Math.floor(((i + 1) / 8) * (gv.length - 1))]);
      const gColor = stepExpr("w", gcuts, JRAMP);
      map.addLayer({ id: "jobsgrid-fill", source: "jobsgrid", type: "fill", minzoom: 13,
        layout: { visibility: "none" }, filter: ["==", ["get", "wardJis"], "__none__"],
        paint: { "fill-color": gColor, "fill-opacity": 0.9 } });
      map.addLayer({ id: "jobsgrid-line", source: "jobsgrid", type: "line", minzoom: 13,
        layout: { visibility: "none" }, filter: ["==", ["get", "wardJis"], "__none__"],
        paint: { "line-color": "#0c1114", "line-width": 0.5, "line-opacity": 0.7 } });
      map.on("click", "jobsgrid-fill", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
          .setHTML(`<div style="font:12.5px sans-serif;color:#000">${esc(p.name)} · 이 건물 종사자 약 <b>${nf(p.w)}</b>명`
            + `<br>${esc(p.area_m2)}m² · ${esc(p.levels)}층${p.levels_known === true || p.levels_known === "true" ? "" : "(가정)"} · ${esc(p.kind)}`
            + `<br><span style="color:#000">모델 추정치 — 실측 아님</span></div>`)
          .addTo(map);
      });
    }

    applyMetric = () => {
      const jm = metric === "jobs";
      for (const id of ["jobsgrid-fill", "jobsgrid-line"]) {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", overlay === "jobs" ? "visible" : "none");
      }
      map.setPaintProperty("subward-fill", "fill-color", jm ? jStepColor : sStepColor);
      document.getElementById("dramp").innerHTML = (jm ? JRAMP : RAMP).map((c) => `<i style="background:${c}"></i>`).join("");
      const s = jm ? jds : sds, cuts = jm ? jcuts : scuts;
      document.getElementById("dscale").innerHTML =
        [s[0], ...cuts, s[s.length - 1]].map((v) => `<span>${nf(v)}</span>`).join("") + `<span style="margin-left:4px">/km²</span>`;
      // 건물 블록 레이어는 거주 인구 기준이라 종사자 모드에서는 숨김
      for (const id of ["bldgpop-fill", "bldgpop-line"]) {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", overlay === "res" ? "visible" : "none");
      }
      // 사이타마·지바·가나가와 건물 색: 거주 모드는 pop, 종사자 모드는 jobs, 그 외에는 일반 지도 색
      for (const k of ["saitama", "chiba", "kanagawa"]) {
        if (!map.getLayer(`bldg-${k}-fill`)) continue;
        const regColor = overlay === "res" ? bldgRegPopColor : overlay === "jobs" ? bldgRegJobColor : bldgBaseReg;
        map.setPaintProperty(`bldg-${k}-fill`, "fill-color", regColor);
        map.setPaintProperty(`bldg-${k}-fill`, "fill-opacity", overlay === "none" ? THEME.bldgOp : 0.9);
        if (map.getLayer(`bldg-${k}-fill-3d`)) {
          map.setPaintProperty(`bldg-${k}-fill-3d`, "fill-extrusion-color", regColor);
          map.setPaintProperty(`bldg-${k}-fill-3d`, "fill-extrusion-opacity", overlay === "none" ? THEME.bldgOp : 0.9);
        }
      }
      if (map.getLayer("bldg23-fill")) {
        map.setPaintProperty("bldg23-fill", "fill-color", overlay === "res" ? bldg23PopColor : overlay === "jobs" ? bldg23JobColor : bldgBaseTokyo);
        map.setPaintProperty("bldg23-fill", "fill-opacity", overlay === "none" ? THEME.bldgOp : 0.9);
      }
      if (map.getLayer("bldg23-fill-3d")) {
        map.setPaintProperty("bldg23-fill-3d", "fill-extrusion-color", overlay === "res" ? bldg23PopColor : overlay === "jobs" ? bldg23JobColor : bldgBaseTokyo);
        map.setPaintProperty("bldg23-fill-3d", "fill-extrusion-opacity", overlay === "none" ? THEME.bldgOp : 0.9);
      }
    };
    applyMetric();

    // ---- 현 단위 정목 데이터 (subward-<현>.json + jobs-<현>.json) 지연 로딩 ----
    const prefPromises = new Map();
    loadPref = (pref) => {
      if (!prefPromises.has(pref)) {
        prefPromises.set(pref, (async () => {
          const [sj, jj] = await Promise.all([loadJSON(`./subward-${pref}.json`), loadJSON(`./jobs-${pref}.json`)]);
          if (!sj || !sj.wards) return false;
          if (jj && jobs) {
            Object.assign(jobs.areas, jj.areas);
            for (const [k, w] of Object.entries(jj.wards)) jobs.wards[String(k).slice(0, 5)] = w;
          }
          for (const [k, w] of Object.entries(sj.wards)) {
            const code = String(w.estat_code || k).slice(0, 5);
            prefMunis.set(code, w);
            for (const a of w.areas) {
              const km2 = a.area_m2 / 1e6;
              features.push({
                type: "Feature",
                properties: {
                  wardJis: code, code: a.code, name_ja: a.name_ja,
                  residents: a.residents, households: a.households,
                  area_km2: km2, density: km2 > 0 ? a.residents / km2 : 0,
                  wdensity: km2 > 0 && jobs && jobs.areas[a.code] ? jobs.areas[a.code].w / km2 : 0,
                },
                geometry: { type: "MultiPolygon", coordinates: a.polygons },
              });
            }
          }
          map.getSource("subward").setData({ type: "FeatureCollection", features });
          sds = features.map((f) => f.properties.density).sort((a, b) => a - b);
          scuts = Array.from({ length: 7 }, (_, i) => sds[Math.floor(((i + 1) / 8) * (sds.length - 1))]);
          sStepColor = stepExpr("density", scuts, RAMP);
          jds = features.map((f) => f.properties.wdensity).sort((a, b) => a - b);
          jcuts = Array.from({ length: 7 }, (_, i) => jds[Math.floor(((i + 1) / 8) * (jds.length - 1))]);
          jStepColor = stepExpr("wdensity", jcuts, JRAMP);
          applyMetric();
          return true;
        })());
      }
      return prefPromises.get(pref);
    };
  }

  // ---- 밀도 표시 컨트롤러: 광역권/구 색칠(인구·종사자 밀도) + 건물 색을 한 번에 전환 ----
  {
    const resBox = document.getElementById("toggle-ov-res"), jobBox = document.getElementById("toggle-ov-jobs");
    const rampEl = document.getElementById("ramp"), scaleEl = document.getElementById("scale");
    const q7 = (a) => { const s = a.filter((x) => x != null && x > 0).sort((p, r) => p - r); return Array.from({ length: 7 }, (_, i) => s[Math.floor(((i + 1) / 8) * (s.length - 1))]); };
    const stepOn = (prop, cuts, ramp) => { const e = ["step", ["coalesce", ["get", prop], 0], ramp[0]]; let last = -Infinity; cuts.forEach((c, i) => { if (c > last) { e.push(c, ramp[i + 1]); last = c; } }); return e; };
    // 종사자 밀도용 시·구 총 종사자 수: 도쿄 23구(jobs.json) + 3개 현(jobs-<현>.json, 시정촌 합계만 쓰므로 작음)
    const workers = new Map();
    if (jobs) for (const [k, w] of Object.entries(jobs.wards)) workers.set(String(k).slice(0, 5), w.workers_total);
    let regCuts = [], wardCuts = [];
    const paintOverlay = () => {
      const on = overlay !== "none", jm = overlay === "jobs";
      const op = (hi, lo) => on ? ["interpolate", ["linear"], ["zoom"], 9, hi, 12, lo, 15, 0.06] : 0;
      if (map.getLayer("region-fill")) {
        map.setPaintProperty("region-fill", "fill-color", jm ? stepOn("wdensity", regCuts, JRAMP) : stepOn("density", rCutsRes, RAMP));
        map.setPaintProperty("region-fill", "fill-opacity", op(0.7, 0.3));
        map.setPaintProperty("region-line", "line-color", on ? "#7c776b" : "#b7b2a5");
        map.setPaintProperty("region-line", "line-opacity", on ? 0.5 : 0.45);
      }
      if (map.getLayer("wards-fill")) {
        map.setPaintProperty("wards-fill", "fill-color", jm ? stepOn("wdensity", wardCuts, JRAMP) : stepOn("density", wCutsRes, RAMP));
        map.setPaintProperty("wards-fill", "fill-opacity", op(0.78, 0.3));
        map.setPaintProperty("wards-line", "line-color", on ? "#7c776b" : "#a9a498");
        map.setPaintProperty("wards-line", "line-opacity", on ? 0.6 : 0.55);
      }
      const cuts = jm ? wardCuts : wCutsRes;
      rampEl.style.display = scaleEl.style.display = on ? "" : "none";
      rampEl.innerHTML = (jm ? JRAMP : RAMP).map((c) => `<i style="background:${c}"></i>`).join("");
      scaleEl.innerHTML = cuts.map((v) => `<span>${nf(v)}</span>`).join("") + `<span style="margin-left:4px">/km²</span>`;
    };
    const rCutsRes = q7([...regionFeatureByCode.values()].map((f) => f.properties.density));
    const wCutsRes = q7([...wardFeaturesByCode.values()].map((f) => f.properties.density));
    syncOverlay = () => {
      resBox.checked = overlay === "res"; jobBox.checked = overlay === "jobs";
      if (overlay !== "none") { metric = overlay; document.getElementById("mres").classList.toggle("on", overlay === "res"); document.getElementById("mjob").classList.toggle("on", overlay === "jobs"); }
      paintOverlay(); applyMetric(); renderList();
    };
    resBox.addEventListener("change", () => { overlay = resBox.checked ? "res" : "none"; syncOverlay(); });
    jobBox.addEventListener("change", () => { overlay = jobBox.checked ? "jobs" : "none"; syncOverlay(); });
    // 종사자 총계를 불러와 wdensity(종사자/km²)를 구·광역권 도형에 붙임
    Promise.all(["saitama", "chiba", "kanagawa"].map((p) => loadJSON(`./jobs-${p}.json`))).then((arr) => {
      for (const j of arr) if (j && j.wards) for (const [k, w] of Object.entries(j.wards)) workers.set(String(k).slice(0, 5), w.workers_total);
      const put = (feats, codeOf, areaOf) => feats.map((f) => { const w = workers.get(codeOf(f)); return { ...f, properties: { ...f.properties, wdensity: w != null && areaOf(f) > 0 ? w / areaOf(f) : null } }; });
      const rf = put([...regionFeatureByCode.values()], (f) => String(f.properties.code), (f) => f.properties.area);
      const wf = put([...wardFeaturesByCode.values()], (f) => String(f.properties.code).slice(0, 5), (f) => f.properties.area);
      regCuts = q7(rf.map((f) => f.properties.wdensity)); wardCuts = q7(wf.map((f) => f.properties.wdensity));
      if (map.getSource("region")) map.getSource("region").setData({ type: "FeatureCollection", features: rf });
      if (map.getSource("wards")) map.getSource("wards").setData({ type: "FeatureCollection", features: wf });
      paintOverlay();
    });
    paintOverlay();
  }

  // ---- 건물별 추정 인구 (building-population.json — 정목 실제 인구를 실제 OSM 건물
  // footprint에 면적×층수×주거용도 가중치로 "배분"한 모델. 건물 단위 실측 인구는 어디에도
  // 공개돼 있지 않음(개인정보) — 이건 추정치이지 실측 데이터가 아님. minzoom 15 이상,
  // 정목 상세 패널이 열려 있을 때만 그 정목 범위로 필터링해서 보여줌. ----
  if (buildingPop && buildingPop.wards) {
    // 건물별 추정 인구 (종사자 지도와 같은 건물 단위 표시)
    const bFeatures = [];
    for (const [jis, w] of Object.entries(buildingPop.wards)) {
      for (const a of w.areas) {
        for (const b of a.buildings) {
          bFeatures.push({
            type: "Feature",
            properties: { wardJis: jis, estimated_population: b.estimated_population,
              levels: b.levels, area_m2: b.area_m2, sourceKind: b.sourceKind },
            geometry: { type: "Polygon", coordinates: [b.polygon] },
          });
        }
      }
    }
    map.addSource("bldgpop", { type: "geojson", data: { type: "FeatureCollection", features: bFeatures } });

    const bpVals = bFeatures.map((f) => f.properties.estimated_population).sort((a, b) => a - b);
    const bpCuts = Array.from({ length: 7 }, (_, i) => bpVals[Math.floor(((i + 1) / 8) * (bpVals.length - 1))]);
    const bpColor = stepExpr("estimated_population", bpCuts, RAMP);

    map.addLayer({ id: "bldgpop-fill", source: "bldgpop", type: "fill", minzoom: 13,
      filter: ["==", ["get", "wardJis"], "__none__"],
      paint: { "fill-color": bpColor, "fill-opacity": 0.85 } });
    map.addLayer({ id: "bldgpop-line", source: "bldgpop", type: "line", minzoom: 13,
      filter: ["==", ["get", "wardJis"], "__none__"],
      paint: { "line-color": "#0c1114", "line-width": 0.3, "line-opacity": 0.6 } });

    map.on("click", "bldgpop-fill", (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup({ closeButton: false })
        .setLngLat(e.lngLat)
        .setHTML(`<div style="font:12.5px sans-serif;color:#000">이 건물 추정 거주 인구 <b>${nf(p.estimated_population)}</b>명`
          + `<br>${esc(p.area_m2)}m² · ${esc(p.levels)}층 · ${esc(p.sourceKind)}<br>`
          + `<span style="color:#000">모델 추정치 — 실측 아님</span></div>`)
        .addTo(map);
    });
    map.on("mouseenter", "bldgpop-fill", () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", "bldgpop-fill", () => (map.getCanvas().style.cursor = ""));
  }

  // ---- 특수 수요: 대학·병원 (special-demand.json — MLIT 国土数値情報 P29 학교/P04 의료기관, 4개 도현).
  // 위치·이름·병상수는 실측, capacity(하루 이용객)는 모델 추정치. 기본은 꺼짐(토글로 켬). ----
  if (specialDemand && specialDemand.attractors) {
    const SPECIAL_COLOR = { university: "#3a72c4", hospital: "#c0504d" };
    const fc = { type: "FeatureCollection",
      features: specialDemand.attractors.map((a) => ({ type: "Feature",
        properties: { name: a.name, kind: a.kind, subType: a.subType || "", capacity: a.capacity,
          beds: a.beds ?? null, emergency: a.emergency ?? null, disasterBase: a.disasterBase ?? null },
        geometry: { type: "Point", coordinates: a.location } })) };
    map.addSource("special-demand", { type: "geojson", data: fc });
    map.addLayer({ id: "special-demand-circle", source: "special-demand", type: "circle", minzoom: 8,
      layout: { visibility: "none" },
      paint: {
        "circle-color": ["match", ["get", "kind"], "university", SPECIAL_COLOR.university, "hospital", SPECIAL_COLOR.hospital, "#888"],
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 3, 12, 5, 16, 9],
        "circle-stroke-color": THEME.name === "dark" ? "#0c1114" : "#ffffff", "circle-stroke-width": 1.2,
        "circle-opacity": 0.9,
      } });
    map.on("click", "special-demand-circle", (e) => {
      const p = e.features[0].properties;
      const kindKo = p.kind === "university" ? `대학·전문 (${esc(p.subType)})` : "병원";
      const extra = p.kind === "hospital"
        ? `<br>병상 ${nf(p.beds)}개${p.emergency ? " · 응급지정" : ""}${p.disasterBase ? " · 재해거점" : ""}`
        : "";
      new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
        .setHTML(`<div style="font:12.5px sans-serif;color:#000"><b>${esc(p.name)}</b><br>${kindKo}${extra}`
          + `<br>일일 이용객 약 <b>${nf(p.capacity)}</b>명 (모델 추정치)`
          + `<br><span style="color:#666">위치·병상수는 실측(MLIT 국토수치정보) — 정원은 실측 아님</span></div>`)
        .addTo(map);
    });
    map.on("mouseenter", "special-demand-circle", () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", "special-demand-circle", () => (map.getCanvas().style.cursor = ""));
    document.getElementById("toggle-special").addEventListener("change", (e) => {
      map.setLayoutProperty("special-demand-circle", "visibility", e.target.checked ? "visible" : "none");
    });
  } else {
    document.getElementById("toggle-special").disabled = true;
  }

  // ---- 사이타마시 건물별 직장 (jobs-buildings-saitama.json — 町丁 실제 종사자를 PLATEAU 건물에
  // 용도별 계수로 배분한 모델, 13.8MB라 토글을 처음 켤 때만 불러옴). 건물 위치는 중심점 하나뿐
  // (도쿄 jobs-buildings.json 과 달리 폴리곤 없음), 사이타마시 10개 구만 해당. ----
  {
    const box = document.getElementById("toggle-plateau-jobs"), statusEl = document.getElementById("plateau-jobs-status"), countEl = document.getElementById("plateau-jobs-count");
    const idx = await loadJSON("./plateau-jobs-index.json");
    if (!idx || !idx.cities?.length) { box.disabled = true; }
    else {
      plateauJobsCities = idx.cities.map((c) => ({ ...c, loaded: false, loading: false }));
      countEl.textContent = `${plateauJobsCities.length}곳`;
      const jobColor = stepExpr("workers", BLDG_JOB_CUTS, JRAMP); // 도쿄 23구 건물 색과 같은 고정 구간 — 도시끼리도 비교 가능
      const status = () => {
        const n = plateauJobsCities.filter((c) => c.loaded).length;
        statusEl.textContent = box.checked ? `불러온 도시 ${n}/${plateauJobsCities.length} — 확대해서 도시 위로 가면 자동으로 불러옵니다` : "";
      };
      const addCity = async (c) => {
        c.loading = true; status();
        const data = await loadJSON(`./${c.file}`);
        c.loading = false;
        if (!data || !data.areas) { c.failed = true; return; }
        const features = [];
        for (const a of Object.values(data.areas)) for (const b of a.buildings) {
          features.push({ type: "Feature", properties: { name_ja: a.name_ja, city: c.ko, use: b.use || "불명", floor_m2: b.floor_m2, area_m2: b.area_m2,
            levels: b.levels, basement_levels: b.basement_levels ?? null, surveyed: b.floor_area_surveyed, workers: b.workers },
            geometry: { type: "Point", coordinates: b.location } });
        }
        const layerId = `plateau-jobs-${c.slug}-circle`, sourceId = `plateau-jobs-${c.slug}`;
        map.addSource(sourceId, { type: "geojson", data: { type: "FeatureCollection", features } });
        map.addLayer({ id: layerId, source: sourceId, type: "circle", minzoom: 13,
          layout: { visibility: box.checked ? "visible" : "none" },
          paint: {
            "circle-color": jobColor,
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, ["+", 0.8, ["*", 0.22, ["sqrt", ["get", "workers"]]]], 17, ["+", 1.8, ["*", 0.55, ["sqrt", ["get", "workers"]]]]],
            "circle-stroke-color": "#0c1114", "circle-stroke-width": 0.4, "circle-opacity": 0.75,
          } });
        map.on("click", layerId, (ev) => {
          const p = ev.features[0].properties;
          new maplibregl.Popup({ closeButton: false }).setLngLat(ev.lngLat)
            .setHTML(`<div style="font:12.5px sans-serif;color:#000">${esc(p.city)} ${esc(p.name_ja)} · 이 건물 종사자 약 <b>${nf(p.workers)}</b>명`
              + `<br>${esc(p.use)} · 연면적 ${nf(p.floor_m2)}m²${p.levels ? ` · ${esc(p.levels)}층` : ""}${p.basement_levels ? ` (지하 ${esc(p.basement_levels)}층)` : ""}${p.surveyed ? "" : " (연면적 추정)"}`
              + `<br><span style="color:#666">町丁 합계는 실측(2021 경제센서스), 건물별 배분은 모델 추정치</span></div>`)
            .addTo(map);
        });
        map.on("mouseenter", layerId, () => (map.getCanvas().style.cursor = "pointer"));
        map.on("mouseleave", layerId, () => (map.getCanvas().style.cursor = ""));
        c.loaded = true; status();
      };
      // 화면(약간 여유)과 겹치는 도시만, 줌 12 이상에서 불러온다 — 시 파일은 0.2~10MB(gzip 0.2~1.6MB)
      const loadVisible = () => {
        if (!box.checked || map.getZoom() < 12) return;
        const b = map.getBounds(), pad = 0.02;
        for (const c of plateauJobsCities) {
          if (c.loaded || c.loading || c.failed) continue;
          const [x0, y0, x1, y1] = c.bbox;
          if (x1 < b.getWest() - pad || x0 > b.getEast() + pad || y1 < b.getSouth() - pad || y0 > b.getNorth() + pad) continue;
          addCity(c);
        }
      };
      box.addEventListener("change", () => {
        const v = box.checked ? "visible" : "none";
        for (const id of plateauJobLayerIds()) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v);
        status(); loadVisible();
      });
      map.on("moveend", loadVisible);
    }
  }

  // ---- 건물 footprint (4개 허브 지구, obstacles.json) ----
  if (obstacles) {
    const fc = { type: "FeatureCollection",
      features: obstacles.obstacles.map((o) => ({ type: "Feature",
        properties: { district: o.district }, geometry: { type: "Polygon", coordinates: [o.polygon] } })) };
    map.addSource("obstacles", { type: "geojson", data: fc });
    map.addLayer({ id: "obstacles-fill", source: "obstacles", type: "fill", minzoom: 13,
      paint: { "fill-color": THEME.bldg, "fill-opacity": THEME.bldgOp } });
    map.addLayer({ id: "obstacles-line", source: "obstacles", type: "line", minzoom: 13,
      paint: { "line-color": THEME.bldgLine, "line-width": 0.4, "line-opacity": 0.6 } });
    capUpdate = () => { document.getElementById("cap").textContent =
      (typeof pmtiles !== "undefined"
        ? `건물 footprint 23구 약 179만 개(도쿄도 토지이용현황조사 건물 폴리곤 · tokyo-survey-buildings.pmtiles — 용도·층수 실측, 23구 전역 균일) + 사이타마·지바·가나가와 약 512만 개(현 전체) · `
        : `건물 ${nf(obstacles.obstacles.length)}개 (마루노우치/도쿄역/긴자·신주쿠·시부야·이케부쿠로) · `)
      + `23구 + 광역권 ${region ? region.municipalities.length : "?"}개(시·정·촌 178 + 지정도시 구 44). `
      + `색 범례(위)는 23구 기준 — 광역권은 같은 색상표를 다른 구간에 적용해 표시(직접 비교 불가). `
      + (subward && subward.wards ? `구를 클릭하면 오른쪽에 상세 패널이 뜹니다 — 정목(町丁) 단위 인구, 23구 전체 지원.` : "")
      + (metric === "jobs" ? ` 건물 색(줌 13+, 23구 전체)은 실측이 아니라 정목 실제 종사자(2021 경제센서스)를 건물 면적×층수×용도별 계수(도쿄도 토지이용현황조사 면적으로 적합, 구별 R² 0.33~0.92)로 배분한 추정 모델입니다 — 회색은 종사자 0명 건물, 색 구간은 0.5·2·5·15·50·150·500명 고정 구간. 사이타마·지바·가나가와는 정목 단위 종사자까지만 있고 건물별 값은 없습니다(회색).` : ` 건물 색(줌 13+, 23구 전체)은 실측이 아니라 정목 실제 인구를 건물 면적×층수×실제 용도(도쿄도 토지이용현황조사) 가중치로 배분한 추정 모델입니다 — 회색은 비주거 건물(0명). 사이타마·지바·가나가와 건물은 도쿄와 달리 OSM 용도 태그만으로 배분한 더 거친 모델이고, OSM에 건물이 없는 정목(지바 약 9%, 사이타마 약 5%, 가나가와 약 1%의 인구)은 배분하지 못합니다.`); };
    capUpdate();
    { const th = document.getElementById("toggle-theme"); th.checked = THEME.name === "light";
      th.addEventListener("change", () => { try { localStorage.setItem("tokyo-theme", th.checked ? "light" : "dark"); } catch {} location.reload(); }); }
    document.getElementById("toggle-terrain").addEventListener("change", (e) => {
      for (const id of ["bm-landuse", "bm-hillshade"]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
    });
    document.getElementById("toggle-rail").addEventListener("change", (e) => {
      if (map.getLayer("bm-rail")) map.setLayoutProperty("bm-rail", "visibility", e.target.checked ? "visible" : "none");
    });
    applyBuildingVisibility = () => {
      const show = document.getElementById("toggle-obstacles").checked;
      const is3d = document.getElementById("toggle-3d").checked;
      const flatIds = map.getLayer("bldg23-fill") ? ["bldg23-fill", "bldg23-line"] : ["obstacles-fill", "obstacles-line"];
      const extrudedIds = ["bldg23-fill-3d"];
      for (const k of ["saitama", "chiba", "kanagawa"]) { flatIds.push(`bldg-${k}-fill`, `bldg-${k}-line`); extrudedIds.push(`bldg-${k}-fill-3d`); }
      const flatV = show && !is3d ? "visible" : "none", extrudedV = show && is3d ? "visible" : "none";
      for (const id of flatIds) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", flatV);
      for (const id of extrudedIds) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", extrudedV);
    };
    document.getElementById("toggle-obstacles").addEventListener("change", applyBuildingVisibility);
  } else {
    document.getElementById("cap").textContent = "obstacles.json 을 불러오지 못했습니다.";
  }

  // ---- 건물 footprint 23구 전체 (tokyo-survey-buildings.pmtiles — 도쿄도 토지이용현황조사 건물 폴리곤, 용도·층수 실측) ----
  // obstacles.json(4개 허브 지구)의 상위 집합이라, 이게 로드되면 obstacles 레이어는 숨긴다.
  // 위치: obstacles 아래 (건물별 추정 인구 레이어는 아래 moveLayer 루프가 다시 맨 위로 올림).
  if (typeof pmtiles !== "undefined") {
    try {
      ensurePmtilesProtocol();
      map.addSource("bldg23", { type: "vector",
        url: "pmtiles://" + new URL("./tokyo-survey-buildings.pmtiles", location.href).href,
        attribution: '東京都 令和3年度 区部土地利用現況調査 (CC BY 4.0)' });
      const before = map.getLayer("obstacles-fill") ? "obstacles-fill" : undefined;
      map.addLayer({ id: "bldg23-fill", source: "bldg23", "source-layer": "building", type: "fill", minzoom: 13,
        paint: { "fill-color": THEME.bldg, "fill-opacity": THEME.bldgOp } }, before);
      map.addLayer({ id: "bldg23-line", source: "bldg23", "source-layer": "building", type: "line", minzoom: 13,
        paint: { "line-color": THEME.bldgLine, "line-width": 0.4, "line-opacity": 0.6 } }, before);
      // 3D 입체 건물 (토글 시에만 보임) — levels(층수)×3.2m, 층수 없으면 2층으로 가정
      map.addLayer({ id: "bldg23-fill-3d", source: "bldg23", "source-layer": "building", type: "fill-extrusion", minzoom: 14,
        layout: { visibility: "none" },
        paint: { "fill-extrusion-color": THEME.bldg, "fill-extrusion-opacity": THEME.bldgOp,
          "fill-extrusion-height": TOKYO_HEIGHT, "fill-extrusion-base": 0 } });
      for (const id of ["obstacles-fill", "obstacles-line"]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
      applyMetric();
      // 클릭/호버는 평면(bldg23-fill)과 3D 입체(bldg23-fill-3d) 레이어 둘 다에 건다 — 3D 보기 중에도 팝업이 뜨도록
      const bldg23Click = (e) => {
        if (!e.features.length) return;
        // Minato/Chuo/허브 정목은 building-population.json 레이어(bldgpop-fill)가 자체 팝업을 띄움 — 중복 방지
        if (map.getLayer("bldgpop-fill") && map.queryRenderedFeatures(e.point, { layers: ["bldgpop-fill"] }).length) return;
        const p = e.features[0].properties;
        const lv = (LU_KO[p.lu] ? `용도 ${LU_KO[p.lu]} (토지이용조사)` : "용도 미상") + (p.levels && p.levels !== "null" ? ` · ${esc(p.levels)}층` : "");
        new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
          .setHTML(`<div style="font:12.5px sans-serif;color:#000">이 건물 추정 ${metric === "jobs" ? `종사자 <b>${Number(p.jobs).toFixed(1)}</b>` : `거주 인구 <b>${Number(p.pop).toFixed(1)}</b>명 (취업자 <b>${Number(p.emp).toFixed(1)}</b>`}명`
            + `<br>${lv}<br><span style="color:#000">모델 추정치 — 실측 아님</span></div>`)
          .addTo(map);
      };
      for (const id of ["bldg23-fill", "bldg23-fill-3d"]) {
        map.on("click", id, bldg23Click);
        map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", id, () => (map.getCanvas().style.cursor = ""));
      }
    } catch (err) { console.warn("tokyo-survey-buildings.pmtiles 연결 실패, obstacles.json 으로 대체:", err); }

    // ---- 건물 footprint 사이타마·지바·가나가와 (현별 pmtiles, OSM) + 건물별 추정 거주 인구 pop (모델, 실측 아님) ----
    try {
      const before = map.getLayer("obstacles-fill") ? "obstacles-fill" : undefined;
      for (const k of ["saitama", "chiba", "kanagawa"]) {
        map.addSource("bldg-" + k, { type: "vector",
          url: "pmtiles://" + new URL(`./${k}-buildings.pmtiles`, location.href).href,
          attribution: '&copy; OpenStreetMap contributors, ODbL' });
        map.addLayer({ id: `bldg-${k}-fill`, source: "bldg-" + k, "source-layer": "building", type: "fill", minzoom: 13,
          paint: { "fill-color": THEME.bldg, "fill-opacity": THEME.bldgOp } }, before);
        map.addLayer({ id: `bldg-${k}-line`, source: "bldg-" + k, "source-layer": "building", type: "line", minzoom: 13,
          paint: { "line-color": THEME.bldgLine, "line-width": 0.4, "line-opacity": 0.6 } }, before);
        map.addLayer({ id: `bldg-${k}-fill-3d`, source: "bldg-" + k, "source-layer": "building", type: "fill-extrusion", minzoom: 14,
          layout: { visibility: "none" },
          paint: { "fill-extrusion-color": THEME.bldg, "fill-extrusion-opacity": THEME.bldgOp,
            "fill-extrusion-height": REG_HEIGHT, "fill-extrusion-base": 0 } });
        // 클릭/호버는 평면(bldg-${k}-fill)과 3D 입체(bldg-${k}-fill-3d) 레이어 둘 다에 건다 — 3D 보기 중에도 팝업이 뜨도록.
        // 거주/종사자 둘 다 pref-building-pop.mjs / pref-building-jobs.mjs 로 만든 pop/jobs 속성이 있어 도쿄와 동일하게 동작.
        const regClick = (e) => {
          if (!e.features.length) return;
          // PLATEAU 건물별 직장 포인트(사이타마·가와사키·사가미하라·요코스카시, 더 정밀한 모델)가 이 픽셀에도 있으면 그쪽
          // 팝업에 양보한다 — 이 포인트 레이어는 res/jobs 밀도 토글(metric)과 무관하게 자체 체크박스로 켜지므로
          // metric 값을 조건에 넣으면 안 된다 (res 모드에서 이 조건을 넣었다가 중복 팝업이 재발한 적 있음).
          const plateauLayers = plateauJobLayerIds().filter((id) => map.getLayer(id));
          if (plateauLayers.length && map.queryRenderedFeatures(e.point, { layers: plateauLayers }).length) return;
          const p = e.features[0].properties;
          const lv = p.levels && p.levels !== "null" ? `${esc(p.levels)}층` : "층수 미상";
          new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
            .setHTML(`<div style="font:12.5px sans-serif;color:#000">이 건물 추정 ${metric === "jobs" ? `종사자 <b>${Number(p.jobs ?? 0).toFixed(1)}</b>` : `거주 인구 <b>${Number(p.pop ?? 0).toFixed(1)}</b>`}명`
              + `<br>${lv} · ${esc(p.kind)}<br><span style="color:#000">모델 추정치 — 실측 아님</span></div>`)
            .addTo(map);
        };
        for (const id of [`bldg-${k}-fill`, `bldg-${k}-fill-3d`]) {
          map.on("click", id, regClick);
          map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", id, () => (map.getCanvas().style.cursor = ""));
        }
      }
      applyMetric();
    } catch (err) { console.warn("사이타마/지바/가나가와 건물 pmtiles 연결 실패:", err); }

    // ---- 3D 보기: 건물을 입체로 세우고(층수×3.2m 추정) 지형 고도를 실제로 들어올림 (기존 음영은 유지) ----
    // 실측 3D가 아니라 2D 데이터에서 만든 근사 — 높이는 토지이용조사/OSM 층수·height 태그 기반 추정치.
    // 지형 고도(map.setTerrain)는 별도 체크박스로 분리했다. MapLibre 는 지형이 켜져 있으면 fill-extrusion 을 "피처마다
    // 그 도형 중심점의 지형 고도만큼 통째로" 들어올리는데, 고가도로 데크는 작은 판 수천 개라 판마다 다른 고도가 붙어
    // 계단(비늘) 모양이 된다 — 데이터 높이는 전부 같은 10m 인데도. 도쿄 도심은 평지라 지형 고도 이득이 거의 없고 산지에서만
    // 의미가 있으므로, 기본은 꺼두고 원할 때만 켜게 한다.
    const applyTerrain3d = () => {
      const want = document.getElementById("toggle-3d").checked && document.getElementById("toggle-3d-terrain").checked;
      try { map.setTerrain(want && map.getSource("terrain") ? { source: "terrain", exaggeration: 1.4 } : null); } catch { /* 지형 소스 연결 실패 시 2D로 유지 */ }
    };
    document.getElementById("toggle-3d").addEventListener("change", (e) => {
      const on = e.target.checked;
      map.easeTo({ pitch: on ? 55 : 0, duration: 700 });
      applyTerrain3d();
      applyBuildingVisibility(); // 건물 숨김 상태를 그대로 존중해 평면/입체 중 맞는 쪽만 켠다 (D-05)
      applyBridgeVisibility();
    });
    document.getElementById("toggle-3d-terrain").addEventListener("change", applyTerrain3d);

    // ---- 도로: 차도(road) / 보행자 도로(path) — 현·도 4개 pmtiles, 토글로 켜고 끔 (기본 꺼짐) ----
    // 건물 아래에 깐다 (건물 사이 빈 곳에 길이 보이도록). 차도는 등급별 색·굵기, 보행자는 가는 점선.
    try {
      const ROAD_AREAS = ["tokyo", "saitama", "chiba", "kanagawa"];
      const kindIn = (...ks) => ["match", ["get", "kind"], ks, true, false];
      const roadClass = (major, mid, tert, rest) => ["match", ["get", "kind"],
        ["motorway", "motorway_link", "trunk", "trunk_link"], major,
        ["primary", "primary_link", "secondary", "secondary_link"], mid,
        ["tertiary", "tertiary_link"], tert, rest];
      const roadColor = roadClass("#e3b25c", "#d6c58f", "#a9b8bd", "#6f8790");
      const roadWidth = ["interpolate", ["linear"], ["zoom"],
        13, roadClass(2.2, 1.6, 1.0, 0.5), 16, roadClass(6, 4.5, 3.2, 2), 19, roadClass(16, 12, 9, 6)];
      const before = map.getLayer("bldg23-fill") ? "bldg23-fill" : (map.getLayer("obstacles-fill") ? "obstacles-fill" : undefined);
      for (const k of ROAD_AREAS) {
        map.addSource("roads-" + k, { type: "vector",
          url: "pmtiles://" + new URL(`./${k}-roads.pmtiles`, location.href).href,
          attribution: '&copy; OpenStreetMap contributors, ODbL' });
        map.addLayer({ id: `road-${k}`, source: "roads-" + k, "source-layer": "road", type: "line", minzoom: 13,
          layout: { visibility: "none", "line-cap": "round", "line-join": "round" },
          paint: { "line-color": roadColor, "line-width": roadWidth, "line-opacity": 0.9 } }, before);
        map.addLayer({ id: `path-${k}`, source: "roads-" + k, "source-layer": "path", type: "line", minzoom: 14,
          layout: { visibility: "none" },
          paint: { "line-color": ["case", kindIn("steps"), "#e08a4c", "#7fd6b0"],
            "line-width": ["interpolate", ["linear"], ["zoom"], 14, 0.7, 17, 1.6, 19, 3],
            "line-dasharray": [2, 1.5], "line-opacity": 0.9 } }, before);
      }
      const wireToggle = (inputId, prefix) => document.getElementById(inputId).addEventListener("change", (e) => {
        for (const k of ROAD_AREAS) map.setLayoutProperty(`${prefix}-${k}`, "visibility", e.target.checked ? "visible" : "none");
      });
      wireToggle("toggle-roads", "road");
      wireToggle("toggle-paths", "path");

      // ---- 고가도로 3D 데크 (bridges-3d.pmtiles: OSM bridge=* 를 도로 등급별 폭×높이로 얇게 세운 것) ----
      // 실측 높이가 아니라 등급별 추정(고속도로 약 9~10m, 간선 6.5~7m, 그 외 5m) — 3D 보기 + 차도 표시가 둘 다 켜져 있을 때만 보임.
      map.addSource("bridges", { type: "vector",
        url: "pmtiles://" + new URL("./bridges-3d.pmtiles", location.href).href,
        attribution: '&copy; OpenStreetMap contributors, ODbL' });
      const bridgeColor = roadClass("#f5a04a", "#e0b820", "#c7b98a", "#9aa6ab");
      map.addLayer({ id: "bridge-3d", source: "bridges", "source-layer": "bridge", type: "fill-extrusion", minzoom: 13,
        layout: { visibility: "none" },
        paint: { "fill-extrusion-color": bridgeColor, "fill-extrusion-opacity": 0.95,
          "fill-extrusion-height": ["get", "top"], "fill-extrusion-base": ["get", "base"] } });
      applyBridgeVisibility = () => {
        const show = document.getElementById("toggle-roads").checked && document.getElementById("toggle-3d").checked;
        if (map.getLayer("bridge-3d")) map.setLayoutProperty("bridge-3d", "visibility", show ? "visible" : "none");
      };
      document.getElementById("toggle-roads").addEventListener("change", applyBridgeVisibility);
    } catch (err) { console.warn("도로 pmtiles 연결 실패:", err); }

    // ---- 공원·학교·병원 + 토지 용도 구획 (areas.pmtiles: OSM 폴리곤) — 색으로 구분하고 이름을 붙인다 ----
    // 이름은 OSM name:ko 가 있으면 그것, 없으면 일본어 이름의 접미사(小学校·公園·病院 …)와 가나를 한글로 바꾼 것(한자는 그대로).
    try {
      map.addSource("areas", { type: "vector", url: "pmtiles://" + new URL("./areas.pmtiles", location.href).href,
        attribution: '&copy; OpenStreetMap contributors, ODbL' });
      const A = THEME.area, cls = ["get", "cls"], kind = ["get", "kind"];
      // "railway"(역·조차장 등 landuse=railway 부지)는 색상표에서 빼서 항상 투명 — 역 이름(bldg-label)·철도선(bm-rail)에
      // 이어 역의 마지막 흔적인 이 뭉텅한 부지 채색까지 지워 달라는 요청.
      const landColor = ["match", kind, "commercial", A.commercial, "retail", A.commercial, "industrial", A.industrial, "farmland", A.farm, "allotments", A.farm,
        "forest", A.forest, "grass", A.grass, "meadow", A.grass, "military", A.military, "rgba(0,0,0,0)"];
      const before = map.getLayer("bm-road-case-minor") ? "bm-road-case-minor" : undefined;
      map.addLayer({ id: "area-land", source: "areas", "source-layer": "area", type: "fill", minzoom: 13,
        filter: ["==", cls, "land"], paint: { "fill-color": landColor } }, before);
      // 정밀한 OSM 물 폴리곤: 지도 데이터(basemap)의 물은 줌 12 해상도라 확대하면 강이 넓은 파란 덩어리로 번지므로 줌 13+ 에서는 이걸로 대체
      map.addLayer({ id: "area-water", source: "areas", "source-layer": "area", type: "fill", minzoom: 13,
        filter: ["==", cls, "water"], paint: { "fill-color": THEME.water } }, before);
      map.setLayerZoomRange("bm-water", 0, 13);
      map.addLayer({ id: "area-park", source: "areas", "source-layer": "area", type: "fill", minzoom: 12,
        filter: ["==", cls, "park"], paint: { "fill-color": A.park, "fill-opacity": 0.95 } }, before);
      map.addLayer({ id: "area-edu", source: "areas", "source-layer": "area", type: "fill", minzoom: 13,
        filter: ["==", cls, "education"], paint: { "fill-color": A.edu } }, before);
      map.addLayer({ id: "area-hospital", source: "areas", "source-layer": "area", type: "fill", minzoom: 13,
        filter: ["==", cls, "hospital"], paint: { "fill-color": A.hospital } }, before);

      // 이름 라벨: labels.pmtiles (공원·학교·병원 + 이름 있는 큰 건물의 점) — 일본어 이름을 한글 발음으로 미리 바꿔 둔 것(ko).
      // 우편번호부 지명 읽기 + 형태소 분석(kuromoji)으로 만든 근사 발음이라 틀린 곳이 있을 수 있음. 큰 것부터, 확대할수록 작은 것까지.
      map.addSource("labels", { type: "vector", url: "pmtiles://" + new URL("./labels.pmtiles", location.href).href,
        attribution: "&copy; OpenStreetMap contributors, ODbL" });
      const tcol = ["match", ["get", "cls"], "park", THEME.label.park, "education", THEME.label.edu, "hospital", THEME.label.hospital, THEME.label.text];
      const areaLabel = (id, minzoom, filter) => map.addLayer({ id, source: "labels", "source-layer": "label", type: "symbol", minzoom,
        filter: ["all", ["!=", ["get", "cls"], "building"], filter],
        layout: { "text-field": ["get", "ko"], "text-font": ["Noto Sans Regular"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 13, 10, 17, 13], "text-max-width": 7, "text-padding": 2,
          "symbol-sort-key": ["-", 0, ["get", "size"]] },
        paint: { "text-color": tcol, "text-halo-color": THEME.label.halo, "text-halo-width": 1.5 } });
      areaLabel("area-label", 13, [">=", ["get", "size"], 3]);
      areaLabel("area-label-mid", 14, ["all", [">=", ["get", "size"], 0.5], ["<", ["get", "size"], 3]]);
      areaLabel("area-label-small", 15, ["<", ["get", "size"], 0.5]);
      document.getElementById("toggle-areas").addEventListener("change", (e) => {
        for (const id of ["area-land", "area-water", "area-park", "area-edu", "area-hospital", "area-label", "area-label-mid", "area-label-small"]) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
      });
    } catch (err) { console.warn("공원·학교 구획 pmtiles 연결 실패:", err); }

    // ---- 도로 이름 (road-labels.pmtiles: 이름 있는 도로 선, ko = 한글 발음) — 선을 따라 글씨가 흐른다 ----
    try {
      map.addSource("road-labels", { type: "vector", url: "pmtiles://" + new URL("./road-labels.pmtiles", location.href).href,
        attribution: "&copy; OpenStreetMap contributors, ODbL" });
      const isHw = ["in", ["get", "kind"], ["literal", ["motorway", "trunk"]]];
      const rl = (id, minzoom, filter, size) => map.addLayer({ id, source: "road-labels", "source-layer": "rlabel", type: "symbol", minzoom, filter,
        layout: { "symbol-placement": "line", "text-field": ["get", "ko"], "text-font": ["Noto Sans Regular"], "text-size": size,
          "symbol-spacing": 320, "text-max-angle": 30, "text-padding": 3, "text-letter-spacing": 0.02 },
        paint: { "text-color": ["case", isHw, THEME.name === "dark" ? "#f0b070" : "#a85a12", THEME.name === "dark" ? "#dfe6ea" : "#5a5f66"],
          "text-halo-color": THEME.label.halo, "text-halo-width": 1.6 } });
      rl("road-name-major", 11, ["in", ["get", "kind"], ["literal", ["motorway", "trunk", "primary"]]], ["interpolate", ["linear"], ["zoom"], 11, 10, 17, 13]);
      rl("road-name-mid", 13, ["in", ["get", "kind"], ["literal", ["secondary", "tertiary"]]], ["interpolate", ["linear"], ["zoom"], 13, 9.5, 17, 12.5]);
      rl("road-name-minor", 15.5, ["in", ["get", "kind"], ["literal", ["residential", "unclassified", "living_street"]]], ["interpolate", ["linear"], ["zoom"], 15.5, 9, 18, 12]);
      document.getElementById("toggle-rnames").addEventListener("change", (e) => {
        for (const id of ["road-name-major", "road-name-mid", "road-name-minor"]) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
      });
    } catch (err) { console.warn("도로 이름 pmtiles 연결 실패:", err); }

    // ---- 큰 건물 이름 (building-labels.pmtiles: 이름 있는 건물 중 한 변 약 40m 이상만, 줌 15+) ----
    // 이름은 한글 발음(labels.pmtiles 의 ko — name:ko 가 있으면 그것, 없으면 일본어 이름을 한글로 옮긴 근사 발음).
    try {
      map.addLayer({ id: "bldg-label", source: "labels", "source-layer": "label", type: "symbol", minzoom: 15,
        filter: ["==", ["get", "cls"], "building"],
        layout: {
          "text-field": ["get", "ko"],
          "text-font": ["Noto Sans Regular"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 15, 10, 18, 13],
          "text-max-width": 7,
          "text-padding": 3,
          visibility: "none", // 기본 숨김 — "큰 건물 이름" 체크박스로 켬 (역 이름도 여기 포함됨, 따로 뺄 레이어 없음)
        },
        paint: { "text-color": THEME.label.text, "text-halo-color": THEME.label.halo, "text-halo-width": 1.4 } });
      document.getElementById("toggle-labels").addEventListener("change", (e) =>
        map.setLayoutProperty("bldg-label", "visibility", e.target.checked ? "visible" : "none"));
    } catch (err) { console.warn("건물 이름 pmtiles 연결 실패:", err); }
  }

  // ---- 건물 클릭 시 실제 통근/통학 목적지 선 (od.json / od-school.json — 시정촌 단위 실측, 건물 단위 아님) ----
  // 건물이 속한 지역(구/시정촌)을 wards-reference.json/kanto-region.json 폴리곤으로 점-내-다각형 판정한 뒤,
  // 그 지역의 od.json/od-school.json 행을 그대로 선으로 그린다 — 건물별 실측이 아니라 "이 건물이 속한
  // 지역 전체가 실제로 가는 곳"이라는 뜻. 목적지가 242개 지점 밖(out/unknown)인 흐름은 그릴 좌표가 없어 제외.
  if (od && wards && region && demand) {
    const codeToLoc = new Map();
    for (const p of demand.points) {
      const code = p.jisCode !== undefined ? String(p.jisCode).slice(0, 5) : p.code;
      if (code !== undefined) codeToLoc.set(String(code), p.location);
    }
    // even-odd 점-내-다각형(barriers.json 등과 같은 방식) — 23구(6자리 jisCode)와 광역권(5자리 code) 둘 다 검사
    const inRing = (lon, lat, ring) => {
      let c = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if (yi > lat !== yj > lat && lon < xi + ((lat - yi) * (xj - xi)) / (yj - yi)) c = !c;
      }
      return c;
    };
    const inMulti = (lon, lat, polygons) => polygons.some((poly) => poly.some((ring) => inRing(lon, lat, ring)));
    const zones = [
      ...wards.wards.map((w) => ({ code: String(w.code).slice(0, 5), polygons: w.polygons })),
      ...region.municipalities.map((m) => ({ code: String(m.code), polygons: m.polygons })),
    ];
    const codeAt = (lon, lat) => zones.find((z) => inMulti(lon, lat, z.polygons))?.code ?? null;

    map.addSource("commute-lines", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("commute-lines-school", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    // 가장 작은 흐름도 밝은 지도 위에서 보이도록 최소 굵기 1.2px / 최소 불투명도 0.5 를 준다 (전부 그리기).
    const commuteWidth = ["interpolate", ["linear"], ["get", "share"], 0, 1.2, 0.02, 2.5, 0.1, 6, 0.3, 11];
    const commuteOpacity = ["interpolate", ["linear"], ["get", "share"], 0, 0.5, 0.05, 0.7, 0.3, 0.95];
    const commuteCase = ["+", commuteWidth, 2];
    map.addSource("commute-origin", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    // 흰 테두리를 먼저 깔아 복잡한 배경 위에서도 선이 분리돼 보이게 한다
    map.addLayer({ id: "commute-lines-school-case", source: "commute-lines-school", type: "line", layout: { visibility: "none", "line-cap": "round" },
      paint: { "line-color": "#ffffff", "line-width": commuteCase, "line-opacity": 0.55 } });
    map.addLayer({ id: "commute-lines-school", source: "commute-lines-school", type: "line", layout: { visibility: "none", "line-cap": "round" },
      paint: { "line-color": "#0aa37a", "line-width": commuteWidth, "line-opacity": commuteOpacity } });
    map.addLayer({ id: "commute-lines-case", source: "commute-lines", type: "line", layout: { "line-cap": "round" },
      paint: { "line-color": "#ffffff", "line-width": commuteCase, "line-opacity": 0.55 } });
    map.addLayer({ id: "commute-lines", source: "commute-lines", type: "line", layout: { "line-cap": "round" },
      paint: { "line-color": "#e8590c", "line-width": commuteWidth, "line-opacity": commuteOpacity } });
    map.addLayer({ id: "commute-origin", source: "commute-origin", type: "circle",
      paint: { "circle-radius": 7, "circle-color": "#e8590c", "circle-stroke-color": "#ffffff", "circle-stroke-width": 2.5 } });

    const linesFor = (originCode, from, odData) => {
      const row = odData?.origins?.[originCode];
      if (!row || !row.dest) return { type: "FeatureCollection", features: [] };
      const total = Object.values(row.dest).reduce((a, b) => a + b, 0) || 1;
      const features = [];
      for (const [destCode, weight] of Object.entries(row.dest)) {
        const to = codeToLoc.get(destCode);
        if (!to || weight <= 0) continue;
        features.push({ type: "Feature", properties: { weight, share: weight / total },
          geometry: { type: "LineString", coordinates: [from, to] } });
      }
      return { type: "FeatureCollection", features };
    };
    const BUILDING_LAYERS = ["bldg23-fill", "bldg23-fill-3d", "bldg-saitama-fill", "bldg-saitama-fill-3d",
      "bldg-chiba-fill", "bldg-chiba-fill-3d", "bldg-kanagawa-fill", "bldg-kanagawa-fill-3d", "obstacles-fill", "bldgpop-fill"];
    let commuteOriginCode = null;
    const clearCommute = () => {
      commuteOriginCode = null;
      map.getSource("commute-lines")?.setData({ type: "FeatureCollection", features: [] });
      map.getSource("commute-lines-school")?.setData({ type: "FeatureCollection", features: [] });
      map.getSource("commute-origin")?.setData({ type: "FeatureCollection", features: [] });
      document.getElementById("commute-cap").style.display = "none";
    };
    const showCommute = (from, originCode) => {
      commuteOriginCode = originCode;
      map.getSource("commute-origin").setData({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: from } });
      map.getSource("commute-lines").setData(linesFor(originCode, from, od));
      map.getSource("commute-lines-school").setData(odSchool ? linesFor(originCode, from, odSchool) : { type: "FeatureCollection", features: [] });
      const cap = document.getElementById("commute-cap");
      const row = od.origins?.[originCode];
      cap.style.display = "block";
      cap.textContent = row
        ? `이 건물이 속한 지역(${originCode})의 실제 통근 목적지 — 주황 = 출퇴근(od.json), 초록 = 통학(od-school.json, 토글). 선 굵기·진하기는 그 지역 전체 이동 중 비중.`
        : `이 지역(${originCode})은 od.json에 실제 통근 데이터가 없습니다(영역 밖이거나 흐름이 0).`;
    };
    map.on("click", BUILDING_LAYERS, (e) => {
      if (!e.features.length) return;
      const code = codeAt(e.lngLat.lng, e.lngLat.lat);
      if (!code) return;
      showCommute([e.lngLat.lng, e.lngLat.lat], code);
    });
    for (const id of BUILDING_LAYERS) map.on("mouseenter", id, () => (map.getCanvas().style.cursor = "pointer"));
    // 건물이 아닌 빈 곳을 클릭하면 지움 (건물 클릭도 이 핸들러가 같이 받으므로, 그때는 무시)
    map.on("click", (e) => {
      const hitBuilding = map.queryRenderedFeatures(e.point, { layers: BUILDING_LAYERS.filter((id) => map.getLayer(id)) }).length > 0;
      if (!hitBuilding && commuteOriginCode) clearCommute();
    });
    document.getElementById("toggle-commute-school").addEventListener("change", (e) => {
      for (const id of ["commute-lines-school", "commute-lines-school-case"])
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
    });
  }

  // 흰색 건물 footprint(obstacles)가 건물별 추정 인구 색을 덮지 않도록 맨 위로 올림
  for (const id of ["bldgpop-fill", "bldgpop-line", "jobsgrid-fill", "jobsgrid-line", "bldg-label", "area-label", "area-label-mid", "area-label-small", "road-name-major", "road-name-mid", "road-name-minor", "region-label", "wards-label", "commute-lines-school-case", "commute-lines-school", "commute-lines-case", "commute-lines", "commute-origin"]) if (map.getLayer(id)) map.moveLayer(id);
});
</script>
